[project]
name = "voice-changer"
version = "2.0.78-beta"
description = "Realtime Voice Changer Client (modern pure-ONNX architecture)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-socketio>=5.11.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "resampy>=0.4.2",
    "soxr>=0.3.7",
    "pyworld>=0.3.4",
    "fire>=0.6.0",
    "textual>=0.50.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "coloredlogs>=15.0.1",
    "faiss-cpu>=1.7.4",
    "torchfcpe>=0.0.4",
    "ngrok>=1.3.0",
    "watchdog>=4.0.0",
    "pyopenssl>=24.0.0",
    "portpicker>=1.6.0",
    "toml>=0.10.2",
    "samplerate>=0.2.1",
    "onnx>=1.16.0",
]

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.20.0",
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
]
dml = [
    "onnxruntime-directml>=1.20.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]
cpu = [
    "onnxruntime>=1.20.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]
mac = [
    "onnxruntime>=1.20.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "client",
    "web_front",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "F841", "E712"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

