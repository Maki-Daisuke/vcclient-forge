<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VCClient Forge</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="wordmark">VCClient <strong>Forge</strong></span>
        <span class="edition">DESKTOP</span>
      </header>
      <section aria-labelledby="status-title" aria-busy="true" id="startup">
        <div class="signal" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <p class="eyebrow">LOCAL CONNECTION</p>
        <h1 id="status-title">Starting backend</h1>
        <p id="message" role="status" aria-live="polite">Waiting for Python to become ready.</p>
        <button id="retry" type="button" hidden>Retry connection</button>
      </section>
      <details id="diagnostics" open>
        <summary>Startup log</summary>
        <div id="terminal-container"></div>
      </details>
      <footer>
        <span id="connection">127.0.0.1:18888</span>
        <span id="elapsed">0s</span>
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
