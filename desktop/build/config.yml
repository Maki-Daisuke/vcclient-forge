version: '3'

info:
  companyName: "VCClient Forge"
  productName: "VCClient Forge"
  productIdentifier: "com.vcclient-forge.app"
  description: "VCClient Forge Desktop Host"
  copyright: "(c) 2026, VCClient Forge"
  comments: "Voice Changer Client Forge"
  version: "2.0.78-forge.0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - frontend/dist
      - frontend/node_modules
    file:
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
