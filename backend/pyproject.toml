[project]
name = "voice-changer"
version = "2.0.78-beta"
description = "Realtime Voice Changer Client (modern pure-ONNX architecture)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-socketio>=5.11.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "resampy>=0.4.2",
    "soxr>=0.3.7",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "coloredlogs>=15.0.1",
    "faiss-cpu>=1.7.4",
    "torch>=2.6.0",
    "pyopenssl>=24.0.0",
    "portpicker>=1.6.0",
    "toml>=0.10.2",
    "samplerate>=0.2.1",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.20.0,<1.25.0",
    "nvidia-cublas-cu12>=12.4.0",
    "nvidia-cudnn-cu12>=9.1.0",
    "nvidia-cufft-cu12>=11.2.0",
    "nvidia-cuda-runtime-cu12>=12.4.0",
]
dml = [
    "onnxruntime-directml>=1.20.0",
]
cpu = [
    "onnxruntime>=1.20.0",
]
mac = [
    "onnxruntime>=1.20.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "dml" },
        { extra = "cpu" },
        { extra = "mac" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "client",
    "web_front",
    "frontend",
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "F841", "E712"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]

