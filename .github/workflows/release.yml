name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win-universal-x64
            os: windows-latest
            edition: universal
          - name: win-cuda-x64
            os: windows-latest
            edition: cuda
          - name: linux-universal-x64
            os: ubuntu-24.04
            edition: universal
          - name: linux-cuda-x64
            os: ubuntu-24.04
            edition: cuda
          - name: linux-universal-arm64
            os: ubuntu-24.04-arm
            edition: universal
          - name: linux-cuda-arm64
            os: ubuntu-24.04-arm
            edition: cuda
          - name: mac-universal-arm64
            os: macos-latest
            edition: universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"

      - name: Install audio, desktop, and archive dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 7zip build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Install desktop build dependencies
        run: |
          npm ci
          npm --prefix desktop/frontend ci

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip

      - name: Build application artifacts
        shell: bash
        run: |
          npm run build -- --edition "${{ matrix.target.edition }}"

      - name: Validate and package application artifacts
        shell: bash
        run: |
          npm run package -- --edition "${{ matrix.target.edition }}" --output-dir "dist"

      - name: Check frozen backend startup
        shell: bash
        timeout-minutes: 2
        run: |
          shopt -s nullglob
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executables=(dist/*/main.exe)
          else
            executables=(dist/*/main)
          fi
          test "${#executables[@]}" -eq 1
          "${executables[0]}" --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target.name }}
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 7

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
