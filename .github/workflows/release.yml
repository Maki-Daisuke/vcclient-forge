name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win-cuda-x64
            os: windows-latest
            edition: cuda
          - name: win-dml-x64
            os: windows-latest
            edition: dml
          - name: win-cpu-x64
            os: windows-latest
            edition: cpu
          - name: win-cpu-arm64
            os: windows-11-arm
            edition: cpu
          - name: linux-cuda-x64
            os: ubuntu-latest
            edition: cuda
          - name: linux-cuda-arm64
            os: ubuntu-24.04-arm
            edition: cuda
          - name: linux-cpu-x64
            os: ubuntu-latest
            edition: cpu
          - name: linux-cpu-arm64
            os: ubuntu-24.04-arm
            edition: cpu
          - name: mac-arm64
            os: macos-latest
            edition: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Rust (Windows desktop)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (Windows desktop)
        if: runner.os == 'Windows'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install desktop build dependencies
        if: runner.os == 'Windows'
        run: npm ci

      - name: Install audio and archive dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 7zip

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip

      - name: Build application artifacts
        shell: bash
        run: |
          npm run build -- --edition "${{ matrix.target.edition }}"

      - name: Validate and package application artifacts
        shell: bash
        run: |
          npm run package -- --edition "${{ matrix.target.edition }}" --output-dir "dist"

      - name: Check frozen backend startup
        shell: bash
        timeout-minutes: 2
        run: |
          shopt -s nullglob
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executables=(dist/*/main.exe)
          else
            executables=(dist/*/main)
          fi
          test "${#executables[@]}" -eq 1
          "${executables[0]}" -- --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target.name }}
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 7

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
