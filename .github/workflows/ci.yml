name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py3.12 / node26
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (CPU + Dev)
        run: uv sync --project backend --extra cpu --extra dev --python 3.12

      - name: Check code formatting (Ruff)
        run: npm run format:check

      - name: Lint code (Ruff)
        run: npm run lint

      - name: Run test suite (pytest)
        run: npm test
