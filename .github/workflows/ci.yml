name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py3.14 / node26
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install system audio and desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install dependencies (CPU + Dev)
        run: uv sync --project backend --extra cpu --extra dev --python 3.14

      - name: Check code formatting (Ruff)
        run: npm run format:check

      - name: Lint code (Ruff)
        run: npm run lint

      - name: Run test suite (mypy & pytest)
        run: npm run test:backend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Run desktop test suite
        run: |
          npm --prefix desktop/frontend ci
          npm run test:desktop

      - name: Check Go code formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l desktop)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build desktop host
        run: npm run build:desktop
