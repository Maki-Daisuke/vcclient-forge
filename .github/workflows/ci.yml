name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py3.14 / node26
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check and build frontend
        run: |
          npm --prefix frontend ci
          npm run check:frontend
          npm run build:frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install system audio and desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install dependencies (Standard + Dev)
        run: uv sync --project backend --extra standard --extra dev --python 3.14

      - name: Check code formatting (Ruff)
        run: npm run format:check

      - name: Lint code (Ruff)
        run: npm run lint

      - name: Run test suite (mypy & pytest)
        run: npm run test:backend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Run desktop test suite
        run: |
          npm --prefix desktop/frontend ci
          npm run test:desktop

      - name: Check Go code formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l desktop)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build desktop host
        run: npm run build:desktop

  test-cuda-arm64:
    name: self-hosted-linux-arm64 / cuda / py3.14
    runs-on: [self-hosted, linux, ARM64, gpu]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm run build:frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install system audio dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install dependencies (CUDA + Dev)
        run: uv sync --project backend --extra cuda --extra dev --python 3.14

      - name: Run test suite (mypy & pytest with CUDA)
        run: npm run test:backend


